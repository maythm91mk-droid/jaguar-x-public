name: fetch-logos
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download candidate logos
        run: |
          sudo apt-get install -y -qq librsvg2-bin >/dev/null
          set +e
          mkdir -p branding/radio/cand
          while read -r key url; do
            [ -z "$key" ] && continue
            code=$(curl -sSL -m 30 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -o "branding/radio/cand/$key" -w '%{http_code}' "$url")
            echo "$key $code $(file -b branding/radio/cand/$key | cut -c1-60)"
            if file -b "branding/radio/cand/$key" | grep -qi svg; then
              rsvg-convert -w 1024 "branding/radio/cand/$key" -o "branding/radio/cand/$key.png" && rm "branding/radio/cand/$key"
            fi
          done < branding/radio/fetch.txt
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add branding/radio/cand
          git commit -m "Radio logos: candidates [skip ci]" || true
          git push
